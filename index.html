<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111216"><meta name="description" content="Elivecode — live coding playground untuk HTML, CSS, JavaScript, JSON, dan Python.">
<title>Elivecode — Live Playground</title><link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<a class="brand" href="./" aria-label="Elivecode"><span class="brand-mark">e<span>/</span></span><span>elivecode<small>LIVE PLAYGROUND</small></span></a>
<div class="project-meta"><span class="status-dot"></span><span id="saveStatus">Local workspace</span><span class="meta-divider"></span><span id="projectName">untitled-project</span></div>
<div class="top-actions"><button class="quiet-button" id="resetBtn">Reset</button><button class="quiet-button" id="downloadBtn">Export ↓</button><button class="run-button" id="runBtn"><span>▶</span> Run <kbd>Ctrl ↵</kbd></button></div>
</header>
<main class="workspace">
<section class="editor-panel" aria-label="Code editor">
<div class="panel-heading"><div class="panel-title"><span class="tiny-square"></span> WORKSPACE <span class="subtle">/ SOURCE</span></div><div class="panel-tools"><span class="language-pill" id="languageLabel">HTML</span><button class="icon-button" id="wrapBtn" title="Toggle line wrap" aria-label="Toggle line wrap">↵</button></div></div>
<div class="file-tabs" role="tablist" aria-label="Source files">
<button class="file-tab active" data-file="html" role="tab" aria-selected="true"><span class="file-icon html-icon">5</span>index.html</button>
<button class="file-tab" data-file="css" role="tab" aria-selected="false"><span class="file-icon css-icon">✳</span>styles.css</button>
<button class="file-tab" data-file="js" role="tab" aria-selected="false"><span class="file-icon js-icon">JS</span>app.js</button>
<button class="file-tab" data-file="json" role="tab" aria-selected="false"><span class="file-icon json-icon">{ }</span>data.json</button>
<button class="file-tab" data-file="python" role="tab" aria-selected="false"><span class="file-icon py-icon">Py</span>main.py</button>
</div>
<div class="editor-body"><div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div><textarea id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Source code editor" wrap="off"></textarea></div>
<footer class="editor-footer"><span id="cursorInfo">Ln 1, Col 1</span><span><span class="keyboard-dot"></span> UTF-8 <span class="footer-divider"></span><span id="fileType">HTML</span></span></footer>
</section>
<div class="resize-handle" aria-hidden="true"></div>
<section class="preview-panel" aria-label="Live preview">
<div class="preview-heading"><div class="panel-title"><span class="preview-icon">◉</span> LIVE PREVIEW <span class="subtle">/ BROWSER</span></div><div class="preview-controls"><div class="device-switch" role="group" aria-label="Preview viewport"><button class="device-btn active" data-device="desktop" title="Desktop" aria-label="Desktop preview">▰</button><button class="device-btn" data-device="tablet" title="Tablet" aria-label="Tablet preview">▣</button><button class="device-btn" data-device="mobile" title="Mobile" aria-label="Mobile preview">▯</button></div><button class="icon-button" id="refreshBtn" title="Refresh preview" aria-label="Refresh preview">↻</button><button class="icon-button" id="popoutBtn" title="Open preview in new tab" aria-label="Open preview in new tab">↗</button></div></div>
<div class="address-bar"><span class="lock-icon">⌑</span><span>elivecode.local/preview</span><span class="address-state">LOCAL</span></div>
<div class="preview-stage"><div class="device-frame desktop-frame" id="deviceFrame"><iframe id="previewFrame" title="Live preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div></div>
<div class="console-panel"><div class="console-heading"><div class="console-tabs"><button class="console-tab active" data-console="console">Console <span class="console-count" id="consoleCount">0</span></button><button class="console-tab" data-console="issues">Issues <span class="issue-count" id="issueCount">0</span></button></div><button class="clear-console" id="clearConsoleBtn">Clear</button></div><div class="console-output" id="consoleOutput"><div class="console-empty"><span>⌁</span><p>Console output will appear here.</p><small>Run your code to see logs and errors.</small></div></div></div>
</section>
</main>
<footer class="statusbar"><span><span class="status-dot"></span> Ready</span><span>Elivecode <span class="status-version">v1.0.0</span></span><span>HTML · CSS · JS · JSON · Python</span></footer>
</div><script src="./app.js"></script>
</body></html>
